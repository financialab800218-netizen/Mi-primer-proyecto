<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TutorIA Cuba - Login</title>
    <style>
        :root { --primary: #1A365D; --secondary: #E53E3E; --bg: #F7FAFC; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: var(--primary); margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .login-card { background: white; padding: 30px; border-radius: 15px; width: 90%; max-width: 350px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        .logo { width: 80px; background: var(--bg); padding: 10px; border-radius: 50%; margin-bottom: 20px; }
        h2 { color: var(--primary); margin-bottom: 20px; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #CBD5E0; border-radius: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: var(--secondary); color: white; border: none; border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer; margin-top: 10px; }
        button:hover { background: #C53030; }
        .error { color: var(--secondary); font-size: 14px; margin-top: 10px; display: none; }
    </style>
</head>
<body>
    <div class="login-card">
        <img src="https://cdn-icons-png.flaticon.com/512/3389/3389081.png" class="logo" alt="Logo">
        <h2>Iniciar Sesión</h2>
        <input type="email" id="email" placeholder="Correo electrónico">
        <input type="password" id="password" placeholder="Contraseña">
        <button onclick="login()">Entrar</button>
        <p class="error" id="error-msg">Correo o contraseña incorrectos</p>
    </div>

    <script>
        async function login() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('error-msg');

            // ATENCIÓN: Reemplaza estas variables con las de tu Supabase (URL y Anon Key)
            const SUPABASE_URL = 'https://ktdpxyqpghipmsftepgl.supabase.co'; 
            const SUPABASE_ANON_KEY = 'sb_publishable_2rDVSIC4U4wtJD-3oaZXqg_PdAxKDOY';

            try {
                const response = await fetch(`${SUPABASE_URL}/rest/v1/profesores?email=eq.${email}&password=eq.${password}`, {
                    headers: {
                        'apikey': SUPABASE_ANON_KEY,
                        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
                    }
                });
                
                const data = await response.json();
                
                if (data.length > 0) {
                    // Guardamos los datos del usuario en el navegador
                    localStorage.setItem('usuario_tutoria', JSON.stringify(data[0]));
                    // Lo mandamos al Dashboard
                    window.location.href = 'index.html';
                } else {
                    errorMsg.style.display = 'block';
                }
            } catch (error) {
                alert("Error de conexión con la base de datos");
            }
        }
    </script>
</body>
</html>
